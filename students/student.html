<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page of Us</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <a href="../index.html">
            <button id="back">❮</button>
        </a>
        <div class="secondary-container">
            <div>
                <div style="display: flex; justify-content: center;">
                    <div class="card">
                        <img id="photo" alt="Foto Siswa">
                        <h4 id="name"></h4>
                    </div>
                </div>
                <h3 class="float" id="ext" style="font-size: 36px;"></h3>
                <p id="about"></p>
            </div>

            <div>
                <p id="desc" style="text-align: center;"></p>
                <br>
                <div class="music">
                    <p class="float" style="font-size: 32px;">
                        <br>Check Out My Favorite Music!<br>|<br>\/
                    </p>

                    <iframe data-testid="embed-iframe"
                            style="border-radius:12px"
                            src=""
                            width="100%" height="152" frameBorder="0" allowfullscreen=""
                            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                            loading="lazy" id="s1"></iframe>

                    <iframe data-testid="embed-iframe" 
                            style="border-radius:12px"
                            src="https://open.spotify.com/embed/track/4ySf8cavypnZvmJcv3N1jT?utm_source=generator&theme=0"
                            width="100%" height="152" frameBorder="0" allowfullscreen=""
                            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                            loading="lazy" id="s2" class="inactive"></iframe>

                    <iframe data-testid="embed-iframe"
                            style="border-radius:12px"
                            src="https://open.spotify.com/embed/track/4VgQDGeib4KMN3iXr410Sr?utm_source=generator&theme=0"
                            width="100%" height="152" frameBorder="0" allowfullscreen=""
                            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                            loading="lazy" id="s3" class="inactive"></iframe>
                    
                    <!--
                        goodbye old music player
                        lmao
                    -->
                </div>
            </div>
        </div>
        <br>
        <h1 style="text-align: center;">My Gallery</h1>
        <div class="secondary-container" style="place-items: center;">
            <div style="padding: 2%;"><img alt="Foto 1" class="gallery inactive"></div>
            <div style="padding: 2%;"><img alt="Foto 2" class="gallery inactive"></div>
            <div style="padding: 2%;"><img alt="Foto 3" class="gallery inactive"></div>
            <div style="padding: 2%;"><img alt="Foto 4" class="gallery inactive"></div>
            <div style="padding: 2%;"><img alt="Foto 5" class="gallery inactive"></div>
            <div style="padding: 2%;"><img alt="Foto 6" class="gallery inactive"></div>
        </div>
    </div>
    
    <script type="module" src="script.js"></script>
    <script type="module" src="data-handler.js"></script>
</body>
</html>
