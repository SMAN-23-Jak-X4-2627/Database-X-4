<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page of Us</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <button id="back">❮</button>
        <div class="secondary-container">
            <div>
                <div style="display: flex; justify-content: center;">
                    <div class="card">
                        <img id="photo" alt="Foto Pelajar">
                        <h4 id="name"></h4>
                    </div>
                </div>
                <h3 class="float inactive" id="dev">/\<br>|<br>main dev of the website!!!</h3>
                <p id="about"></p>
            </div>

            <div>
                <p id="desc" style="text-align: center;"></p>
                <br>
                <div class="music">
                    <p class="float">
                        <br>Check Out My Favorite Music!<br>|<br>\/
                    </p>
                    <div class="music-player">
                        <div class="cell">
                            <img alt="s1" id="s1c">
                        </div>
                        <div class="cell">
                            <audio id="s1au"></audio>

                            <h3 id="s1t"></h3>

                            <div style="display: flex; align-items: center;">
                                <button id="s1b">▶</button>
                                <input type="range" id="s1sb" min="0" max="100" value="0">
                                <span id="s1tl">0:00 / 0:00</span>
                            </div>
                        </div>

                        <div class="inactive cell" id="s2ca">
                            <img alt="s2" id="s2c">
                        </div>
                        <div class="inactive cell" id="s2cb">
                            <audio id="s2au"></audio>

                            <h3 id="s2t"></h3>

                            <div style="display: flex; align-items: center;">
                                <button id="s2b">▶</button>
                                <input type="range" id="s2sb" min="0" max="100" value="0">
                                <span id="s2tl">0:00 / 0:00</span>
                            </div>
                        </div>

                        <div class="inactive cell" id="s3ca">
                            <img alt="s3" id="s3c">
                        </div>
                        <div class="inactive cell" id="s3cb">
                            <audio id="s3au"></audio>

                            <h3 id="s3t"></h3>

                            <div style="display: flex; align-items: center;">
                                <button id="s3b">▶</button>
                                <input type="range" id="s3sb" min="0" max="100" value="0">
                                <span id="s3tl">0:00 / 0:00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <br>
        <h1 style="text-align: center;">My Gallery</h1>
        <div class="secondary-container" style="place-items: center;">
            <div style="padding: 2%;"><img alt="Foto 1" class="gallery inactive"></div>
            <div style="padding: 2%;"><img alt="Foto 2" class="gallery inactive"></div>
            <div style="padding: 2%;"><img alt="Foto 3" class="gallery inactive"></div>
            <div style="padding: 2%;"><img alt="Foto 4" class="gallery inactive"></div>
            <div style="padding: 2%;"><img alt="Foto 5" class="gallery inactive"></div>
            <div style="padding: 2%;"><img alt="Foto 6" class="gallery inactive"></div>
        </div>
    </div>
    
    <script type="module" src="script.js"></script>
    <script type="module" src="data-handler.js"></script>
</body>
</html>
